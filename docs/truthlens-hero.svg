<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">TruthLens</title>
  <desc id="d">TruthLens pipeline: ask a question, retrieve evidence for and against, compare and flag conflicts, answer with file and page citations.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1633"/>
      <stop offset="1" stop-color="#16214a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="62%" r="55%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity=".18"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#8da2d6" fill-opacity=".16"/>
    </pattern>
    <filter id="soft" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <!-- isometric cube, top face centred on (0,0) -->
    <g id="cube">
      <polygon points="-60,0 0,30 0,80 -60,50" style="fill:var(--l)"/>
      <polygon points="0,30 60,0 60,50 0,80" style="fill:var(--r)"/>
      <polygon points="0,-30 60,0 0,30 -60,0" style="fill:var(--t)"/>
      <polyline points="-60,0 0,30 60,0" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="1.2"/>
      <line x1="0" y1="30" x2="0" y2="80" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/>
    </g>
  </defs>

  <style>
    text { font-family: "Trebuchet MS", "Segoe UI", system-ui, -apple-system, sans-serif; }
    .float { animation: float 4.6s ease-in-out infinite; }
    .shadow { animation: shade 4.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .flow { stroke-dasharray: 7 9; animation: flow 1.4s linear infinite; }
    .shake { animation: shake 3.2s ease-in-out infinite; }
    .ring { animation: ring 3.2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    @keyframes shade { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: .3; transform: scale(.88); } }
    @keyframes flow { to { stroke-dashoffset: -32; } }
    @keyframes shake { 0%,70%,100% { transform: translateX(0); } 74% { transform: translateX(-3px); } 78% { transform: translateX(3px); } 82% { transform: translateX(-2px); } 86% { transform: translateX(2px); } }
    @keyframes ring { 0% { opacity: .8; transform: scale(.6); } 100% { opacity: 0; transform: scale(1.5); } }
    @media (prefers-reduced-motion: reduce) {
      .float, .shadow, .flow, .shake, .ring { animation: none; }
    }
  </style>

  <!-- backdrop -->
  <rect width="1200" height="430" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="430" rx="24" fill="url(#dots)"/>
  <rect width="1200" height="430" rx="24" fill="url(#glow)"/>

  <!-- heading -->
  <text x="600" y="92" text-anchor="middle" font-size="62" font-weight="700" fill="url(#title)" letter-spacing="1">TruthLens</text>
  <text x="600" y="132" text-anchor="middle" font-size="20" fill="#c3cff0">Answers that show their evidence, or say they can't.</text>

  <!-- connecting lines on the floor -->
  <g fill="none" stroke="#5eead4" stroke-opacity=".55" stroke-width="2.5" stroke-linecap="round">
    <path class="flow" d="M285 300 C 340 322, 345 322, 395 300"/>
    <path class="flow" d="M555 300 C 610 322, 615 322, 665 300"/>
    <path class="flow" d="M825 300 C 880 322, 885 322, 930 300"/>
  </g>
  <!-- data packets travelling along the lines -->
  <g fill="#e0fdf8">
    <circle r="4.5"><animateMotion dur="2.4s" repeatCount="indefinite" path="M285 300 C 340 322, 345 322, 395 300"/></circle>
    <circle r="4.5"><animateMotion dur="2.4s" begin=".8s" repeatCount="indefinite" path="M555 300 C 610 322, 615 322, 665 300"/></circle>
    <circle r="4.5"><animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite" path="M825 300 C 880 322, 885 322, 930 300"/></circle>
  </g>

  <!-- 1. ask -->
  <g transform="translate(200 250)">
    <ellipse class="shadow" cx="0" cy="92" rx="70" ry="16" fill="#000" filter="url(#soft)"/>
    <g class="float" style="animation-delay:0s">
      <use href="#cube" xlink:href="#cube" style="--t:#7dd3fc;--l:#2b6fa8;--r:#3b8fd0"/>
      <g transform="translate(0 -30) matrix(.5 .25 -.5 .25 0 0)">
        <text x="60" y="60" text-anchor="middle" dominant-baseline="central" font-size="70" font-weight="700" fill="#0d2b4a">?</text>
      </g>
    </g>
  </g>

  <!-- 2. retrieve -->
  <g transform="translate(470 250)">
    <ellipse class="shadow" cx="0" cy="92" rx="70" ry="16" fill="#000" filter="url(#soft)" style="animation-delay:.5s"/>
    <g class="float" style="animation-delay:.5s">
      <use href="#cube" xlink:href="#cube" style="--t:#5eead4;--l:#14827a;--r:#1fb5a8"/>
      <g transform="translate(0 -30) matrix(.5 .25 -.5 .25 0 0)">
        <text x="60" y="60" text-anchor="middle" dominant-baseline="central" font-size="64" font-weight="700" fill="#06403b">±</text>
      </g>
    </g>
  </g>

  <!-- 3. compare, the one that reacts -->
  <g transform="translate(745 250)">
    <ellipse class="shadow" cx="0" cy="92" rx="70" ry="16" fill="#000" filter="url(#soft)" style="animation-delay:1s"/>
    <g class="float" style="animation-delay:1s">
      <g class="shake">
        <use href="#cube" xlink:href="#cube" style="--t:#fcd34d;--l:#b7791f;--r:#e0a325"/>
        <g transform="translate(0 -30) matrix(.5 .25 -.5 .25 0 0)">
          <text x="60" y="60" text-anchor="middle" dominant-baseline="central" font-size="64" font-weight="700" fill="#5a3a05">≠</text>
        </g>
        <polygon class="ring" points="0,-30 60,0 0,30 -60,0" fill="none" stroke="#fcd34d" stroke-width="2.5"/>
      </g>
    </g>
  </g>

  <!-- 4. answer -->
  <g transform="translate(1000 250)">
    <ellipse class="shadow" cx="0" cy="92" rx="70" ry="16" fill="#000" filter="url(#soft)" style="animation-delay:1.5s"/>
    <g class="float" style="animation-delay:1.5s">
      <use href="#cube" xlink:href="#cube" style="--t:#a7f3d0;--l:#1d7a55;--r:#2fae7c"/>
      <g transform="translate(0 -30) matrix(.5 .25 -.5 .25 0 0)">
        <text x="60" y="60" text-anchor="middle" dominant-baseline="central" font-size="66" font-weight="700" fill="#073b27">✓</text>
      </g>
    </g>
  </g>

  <!-- labels -->
  <g text-anchor="middle" fill="#e6ecff">
    <text x="200" y="378" font-size="21" font-weight="700">Ask</text>
    <text x="470" y="378" font-size="21" font-weight="700">Retrieve</text>
    <text x="745" y="378" font-size="21" font-weight="700">Compare</text>
    <text x="1000" y="378" font-size="21" font-weight="700">Answer</text>
  </g>
  <g text-anchor="middle" fill="#9fb0dc" font-size="15">
    <text x="200" y="402">in any of 11 languages</text>
    <text x="470" y="402">evidence for and against</text>
    <text x="745" y="402">flags conflicts between files</text>
    <text x="1000" y="402">with file and page, or "I don't know"</text>
  </g>
</svg>
