<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 285" width="1200" height="285" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">TruthLens: Core features</title>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1633"/><stop offset="1" stop-color="#16214a"/></linearGradient>
<pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#8da2d6" fill-opacity=".16"/></pattern>
<filter id="soft" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="6"/></filter>
<g id="cube"><polygon points="-60,0 0,30 0,80 -60,50" style="fill:var(--l)"/><polygon points="0,30 60,0 60,50 0,80" style="fill:var(--r)"/><polygon points="0,-30 60,0 0,30 -60,0" style="fill:var(--t)"/>
<polyline points="-60,0 0,30 60,0" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.4"/><line x1="0" y1="30" x2="0" y2="80" stroke="#fff" stroke-opacity=".18" stroke-width="1.2"/></g></defs>
<style>text{font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif}
